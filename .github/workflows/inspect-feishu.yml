name: Inspect Feishu table structure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Inspect and encrypt table structure
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
          FEISHU_PHOTOS_TABLE_ID: ${{ secrets.FEISHU_PHOTOS_TABLE_ID }}
          FEISHU_MEMBERS_TABLE_ID: ${{ secrets.FEISHU_MEMBERS_TABLE_ID }}
        run: node scripts/inspect-feishu.mjs
